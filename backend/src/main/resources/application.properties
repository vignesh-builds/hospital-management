spring.application.name=hospital-management

server.port=${PORT:8080}

# ==============================
# DATABASE
# ==============================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hospital_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ==============================
# JPA
# ==============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ==============================
# JWT
# ==============================

jwt.secret=${JWT_SECRET:hospital-management-secret-key-change-this-in-production}
jwt.expiration=${JWT_EXPIRATION:3600000}

# ==============================
# APP
# ==============================

# Time zone used for "past date / past time" checks
app.timezone=${APP_TIMEZONE:Asia/Kolkata}

# Comma separated list of frontend URLs allowed to call this API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://hospital-frontend-7jfj.onrender.com}

# First admin account (created only when no ADMIN exists)
app.admin.email=${ADMIN_EMAIL:admin@hospital.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
