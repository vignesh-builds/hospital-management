spring.application.name=hospital-management

server.port=${PORT:8080}

# ==============================
# DATABASE
# ==============================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hospital_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ==============================
# JPA
# ==============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ==============================
# JWT
# ==============================

# REQUIRED. At least 32 characters. No default on purpose - the app refuses to start without it.
# (For local development use:  SPRING_PROFILES_ACTIVE=dev )
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:3600000}

# ==============================
# APP
# ==============================

# Time zone used for "past date / past time" checks
app.timezone=${APP_TIMEZONE:Asia/Kolkata}

# Comma separated list of frontend URLs allowed to call this API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://hospital-frontend-7jfj.onrender.com}

# First admin account (created only when no ADMIN exists)
app.admin.email=${ADMIN_EMAIL:admin@hospital.com}
# REQUIRED the first time the app starts on an empty database (min 8 characters).
app.admin.password=${ADMIN_PASSWORD:}

# ==============================
# EMAIL (SMTP)
# ==============================
# ==============================
# EMAIL (SMTP)
# ==============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:vignesh.builds@gmail.com}
